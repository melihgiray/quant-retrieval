# First real fine-tune. Batch size 64 is the default rather than the maximum
# that fits, because batch size is one of the axes item 4 ablates and a default
# sitting in the middle of that range makes the comparison readable.
run_name: minilm_tuned
seed: 17
model_name: sentence-transformers/all-MiniLM-L6-v2
max_length: 256
batch_size: 64
epochs: 3
learning_rate: 2.0e-5
weight_decay: 0.01
warmup_ratio: 0.1
max_grad_norm: 1.0
temperature: 0.05
log_every: 25
device: auto
output_dir: checkpoints/minilm_tuned
history: results/minilm_tuned_training.json
