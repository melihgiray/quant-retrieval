# BM25 + reranker. Depth 50: the reranker only sees the first 50 candidates, so
# whatever the base retriever misses in its top 50 is unreachable here.
run_name: bm25_rerank_val
seed: 17
retriever: rerank
split: val
max_results: 100
display_name: BM25 + reranker
display_order: 61
parameters:
  model_name: checkpoints/reranker/epoch-2
  depth: 50
  batch_size: 64
  max_length: 320
  device: auto
  base:
    retriever: bm25
    parameters:
      k1: 1.2
      b: 0.75
output: results/bm25_rerank_val.json
