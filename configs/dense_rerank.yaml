# Tuned + reranker. Depth 50: the reranker only sees the first 50 candidates, so
# whatever the base retriever misses in its top 50 is unreachable here.
# One epoch, not two: the second could not complete on this machine, see
# RESULTS.md.
run_name: dense_rerank_val
seed: 17
retriever: rerank
split: val
max_results: 100
display_name: Tuned + reranker (undertrained)
display_order: 62
parameters:
  model_name: checkpoints/reranker/epoch-1
  depth: 50
  batch_size: 64
  max_length: 320
  device: auto
  base:
    retriever: dense
    parameters:
      model_name: checkpoints/minilm_tuned/epoch-3
      batch_size: 128
      max_length: 256
      device: auto
output: results/dense_rerank_val.json
