# Hybrid + reranker. Depth 50: the reranker only sees the first 50 candidates, so
# whatever the base retriever misses in its top 50 is unreachable here.
run_name: hybrid_rerank_mixed_val
seed: 17
retriever: rerank
split: val
max_results: 100
display_name: Hybrid + reranker (mixed negatives)
display_order: 73
parameters:
  model_name: checkpoints/reranker_mixed/epoch-2
  depth: 50
  batch_size: 64
  max_length: 320
  device: auto
  base:
    retriever: hybrid
    parameters:
      rrf_k: 60
      depth: 100
      retrievers:
        - retriever: bm25
          parameters:
            k1: 1.2
            b: 0.75
        - retriever: dense
          parameters:
            model_name: checkpoints/minilm_tuned/epoch-3
            batch_size: 128
            max_length: 256
            device: auto
output: results/hybrid_rerank_mixed_val.json
