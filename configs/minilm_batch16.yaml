# Batch size ablation. Learning rate is held at 2e-5 across all four sizes, so
# this compares batch size and number of updates together, not batch size alone.
run_name: minilm_batch16
seed: 17
model_name: sentence-transformers/all-MiniLM-L6-v2
max_length: 256
batch_size: 16
epochs: 3
learning_rate: 2.0e-5
weight_decay: 0.01
warmup_ratio: 0.1
max_grad_norm: 1.0
temperature: 0.05
pooling: mean
log_every: 50
device: auto
output_dir: checkpoints/minilm_batch16
history: results/minilm_batch16_training.json
