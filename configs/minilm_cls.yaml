# Pooling ablation against configs/base.yaml. The base model was distilled with
# mean pooling, so its first token never learned to summarise a sequence.
run_name: minilm_cls
seed: 17
model_name: sentence-transformers/all-MiniLM-L6-v2
max_length: 256
batch_size: 64
epochs: 3
learning_rate: 2.0e-5
weight_decay: 0.01
warmup_ratio: 0.1
max_grad_norm: 1.0
temperature: 0.05
pooling: cls
log_every: 50
device: auto
output_dir: checkpoints/minilm_cls
history: results/minilm_cls_training.json
