[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-retrieval"
version = "0.1.0"
description = "Semantic search over quantitative finance Q&A"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "py7zr>=0.21",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "fastapi>=0.116",
    "huggingface-hub>=1.5",
    "lxml>=5.2",
    "scipy>=1.14",
    "torch==2.13.0",
    "tqdm>=4.66",
    "transformers==5.14.1",
    "uvicorn[standard]>=0.35",
]

[project.optional-dependencies]
# faiss is not a core dependency. It and torch each bundle their own OpenMP
# runtime, and importing both in one process aborts on macOS. The Linux wheels
# share a runtime, so the ANN work runs in the cloud.
ann = [
    "faiss-cpu>=1.8",
]
dev = [
    "httpx>=0.28",
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quant_retrieval = ["serve/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
